[project]
name = "glosator"
version = "0.1.0"
description = "PDF textbook to sequential study notes in an Obsidian vault, fully local"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Okulanis", email = "109816464+FPGArtktic@users.noreply.github.com" }]
dependencies = [
    "docling>=2.0",
    "gradio>=4.44",
    "ollama>=0.3",
    "pillow>=10.0",
    "pypdfium2>=5.0",  # the v5 outline API: PdfBookmark.get_dest()
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
glosator = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
